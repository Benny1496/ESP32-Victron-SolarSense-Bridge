# Isolated W23a persistent B-rep naming and design save/reopen regression.
# Independent follow-up of Test #12: grouped TWO exact half-cylinder surfaces per physical bore.\n# Push marker launches once while manual workflow_dispatch remains available.
# Official SolidCraft sources remain read-only; nothing is blessed or pushed upstream.
name: SolidCraft W23a persistent references - Windows (test 13)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/solidcraft-test13-launch.txt'

permissions:
  contents: read

concurrency:
  group: solidcraft-w23a-persistent-13-refs-test13
  cancel-in-progress: false

jobs:
  persistent-refs:
    name: W23a exact bore references, undo/redo and save/reopen
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout pinned official SolidCraft drawings source
        uses: actions/checkout@v4
        with:
          repository: tangency-labs/solidcraft
          ref: ebafe07487df5cdd108e091db939de765645e5eb
          path: solidcraft
          persist-credentials: false

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore Windows Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solidcraft
          key: solidcraft-w23a-identity-windows

      - name: Build pinned SolidCraft CLI
        working-directory: solidcraft
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          mkdir -p ci-reports/w23a-persistent-13
          git rev-parse HEAD | tee ci-reports/w23a-persistent-13/source-commit.txt
          rustc --version | tee ci-reports/w23a-persistent-13/rust-version.txt
          python --version | tee ci-reports/w23a-persistent-13/python-version.txt
          cargo build --locked --profile ci -p solidcraft-cli 2>&1 | tee ci-reports/w23a-persistent-13/build.log
          test -f target/ci/solidcraft-cli.exe

      - name: Verify certified named faces/edges and save/reopen
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          python harness/.github/scripts/solidcraft-w23a-persistent-13-refs.py \
            --cli solidcraft/target/ci/solidcraft-cli.exe \
            --source solidcraft \
            --out solidcraft/ci-reports/w23a-persistent-13 \
            2>&1 | tee solidcraft/ci-reports/w23a-persistent-13/check-output.log

      - name: Summarize actual case results
        if: always()
        shell: bash
        run: |
          if test -f solidcraft/ci-reports/w23a-persistent-13/summary.json; then
            python -c "import json; d=json.load(open('solidcraft/ci-reports/w23a-persistent-13/summary.json',encoding='utf-8')); print('W23a persistent refs: '+d['status']+'; '+str(len(d['cases']))+' scenarios; '+str(d['failed'])+' failures')"
          fi

      - name: Preserve reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-w23a-persistent-13-references-windows
          path: solidcraft/ci-reports/w23a-persistent-13/
          retention-days: 7
          if-no-files-found: warn
