# =========================================================
# BLE Scanner
# =========================================================

esp32_ble_tracker:

  scan_parameters:
    interval: 320ms
    window: 320ms
    continuous: true
    active: false

  # BLE packet capture from the live-tested 4.3.1 base / BLE-Paketerfassung aus 4.3.1.
  # Keeps the existing Bluetooth proxy and 31-byte advertising extraction.
  on_ble_advertise:
    - mac_address:
        - ${sensor_1_mac}
        - ${sensor_2_mac}
      then:
        - lambda: |-
            const auto &pkt = x.get_scan_result();
            const unsigned length = static_cast<unsigned>(pkt.adv_data_len) +
                                    static_cast<unsigned>(pkt.scan_rsp_len);
            ESP_LOGV("victron_bridge_probe",
                     "BLE %s | RSSI %d | ADV bytes %u",
                     x.address_str().c_str(), x.get_rssi(), length);
            // Vollstaendige Advertising-Bytes; gleiche Scanner-Ergebnisse wie bisher.
            if (length == 0 || length > sizeof(pkt.ble_adv)) return;
            std::string hex;
            hex.reserve(length * 2);
            char piece[3];
            for (unsigned i = 0; i < length; ++i) {
              snprintf(piece, sizeof(piece), "%02X", pkt.ble_adv[i]);
              hex += piece;
            }
            if (x.address_str() == "${sensor_1_mac}") {
              id(victron_so_adv_hex).publish_state(hex);
            } else if (x.address_str() == "${sensor_2_mac}") {
              id(victron_nw_adv_hex).publish_state(hex);
            }

  on_ble_manufacturer_data_advertise:

    # =======================================================
    # SÜDOST
    # =======================================================

    - mac_address: ${sensor_1_mac}
      manufacturer_id: "02E1"
      then:

        - lambda: |-
            if (x.size() < 22) {
              return;
            }

            if (x[0] != 0x10) {
              return;
            }

            uint16_t raw_irradiance =
                static_cast<uint16_t>(x[13]) |
                (static_cast<uint16_t>(x[14]) << 8);

            float irradiance =
                static_cast<float>(raw_irradiance) / 10.0f;

            uint32_t raw_yield =
                static_cast<uint32_t>((x[15] >> 4) & 0x0F) |
                (static_cast<uint32_t>(x[16]) << 4) |
                (static_cast<uint32_t>(x[17]) << 12);

            float yield =
                static_cast<float>(raw_yield) / 100.0f;

            uint16_t raw_power =
                static_cast<uint16_t>(x[18]) |
                (static_cast<uint16_t>(x[19] & 0x3F) << 8);

            float power =
                static_cast<float>(raw_power);

            uint16_t raw_temperature =
                static_cast<uint16_t>((x[19] >> 6) & 0x03) |
                (static_cast<uint16_t>(x[20]) << 2) |
                (static_cast<uint16_t>(x[21] & 0x01) << 10);

            float temperature =
                static_cast<float>(raw_temperature) / 10.0f - 60.0f;


            // Messwerte veröffentlichen

            id(solarsense_suedost_irradiance).publish_state(irradiance);
            id(solarsense_suedost_power).publish_state(power);
            id(solarsense_suedost_yield).publish_state(yield);
            id(solarsense_suedost_temperature).publish_state(temperature);


            // Gültige BLE-Pakete zählen

            static uint32_t packet_count_suedost = 0;
            packet_count_suedost++;

            id(solarsense_suedost_packet_count).publish_state(
              static_cast<float>(packet_count_suedost)
            );


            // Empfangszeit speichern

            id(solarsense_suedost_last_packet_ms) = millis();

            auto now = id(homeassistant_time).now();

            if (now.is_valid()) {

              id(solarsense_suedost_last_packet_timestamp) = now.timestamp;

              if (irradiance > 5.0f) {
                id(solarsense_suedost_last_sun_timestamp) = now.timestamp;
              }
            }


            // RAW-Daten maximal einmal pro Sekunde veröffentlichen

            static uint32_t last_raw_publish_suedost = 0;

            if (millis() - last_raw_publish_suedost >= 1000) {

              std::string raw_hex;

              raw_hex.reserve(x.size() * 2);

              char buf[3];

              for (auto b : x) {

                snprintf(buf, sizeof(buf), "%02X", b);

                raw_hex += buf;
              }

              id(solarsense_suedost_raw).publish_state(raw_hex);

              last_raw_publish_suedost = millis();
            }


            ESP_LOGD(
              "solarsense",
              "Südost: %.1f W/m² | %.0f W | %.2f kWh | %.1f °C",
              irradiance,
              power,
              yield,
              temperature
            );


    # =======================================================
    # NORDWEST
    # =======================================================

    - mac_address: ${sensor_2_mac}
      manufacturer_id: "02E1"
      then:

        - lambda: |-
            if (x.size() < 22) {
              return;
            }

            if (x[0] != 0x10) {
              return;
            }

            uint16_t raw_irradiance =
                static_cast<uint16_t>(x[13]) |
                (static_cast<uint16_t>(x[14]) << 8);

            float irradiance =
                static_cast<float>(raw_irradiance) / 10.0f;

            uint32_t raw_yield =
                static_cast<uint32_t>((x[15] >> 4) & 0x0F) |
                (static_cast<uint32_t>(x[16]) << 4) |
                (static_cast<uint32_t>(x[17]) << 12);

            float yield =
                static_cast<float>(raw_yield) / 100.0f;

            uint16_t raw_power =
                static_cast<uint16_t>(x[18]) |
                (static_cast<uint16_t>(x[19] & 0x3F) << 8);

            float power =
                static_cast<float>(raw_power);

            uint16_t raw_temperature =
                static_cast<uint16_t>((x[19] >> 6) & 0x03) |
                (static_cast<uint16_t>(x[20]) << 2) |
                (static_cast<uint16_t>(x[21] & 0x01) << 10);

            float temperature =
                static_cast<float>(raw_temperature) / 10.0f - 60.0f;


            // Messwerte veröffentlichen

            id(solarsense_nordwest_irradiance).publish_state(irradiance);
            id(solarsense_nordwest_power).publish_state(power);
            id(solarsense_nordwest_yield).publish_state(yield);
            id(solarsense_nordwest_temperature).publish_state(temperature);


            // Gültige BLE-Pakete zählen

            static uint32_t packet_count_nordwest = 0;
            packet_count_nordwest++;

            id(solarsense_nordwest_packet_count).publish_state(
              static_cast<float>(packet_count_nordwest)
            );


            // Empfangszeit speichern

            id(solarsense_nordwest_last_packet_ms) = millis();

            auto now = id(homeassistant_time).now();

            if (now.is_valid()) {

              id(solarsense_nordwest_last_packet_timestamp) = now.timestamp;

              if (irradiance > 5.0f) {
                id(solarsense_nordwest_last_sun_timestamp) = now.timestamp;
              }
            }


            // RAW-Daten maximal einmal pro Sekunde veröffentlichen

            static uint32_t last_raw_publish_nordwest = 0;

            if (millis() - last_raw_publish_nordwest >= 1000) {

              std::string raw_hex;

              raw_hex.reserve(x.size() * 2);

              char buf[3];

              for (auto b : x) {

                snprintf(buf, sizeof(buf), "%02X", b);

                raw_hex += buf;
              }

              id(solarsense_nordwest_raw).publish_state(raw_hex);

              last_raw_publish_nordwest = millis();
            }


            ESP_LOGD(
              "solarsense",
              "Nordwest: %.1f W/m² | %.0f W | %.2f kWh | %.1f °C",
              irradiance,
              power,
              yield,
              temperature
            );


